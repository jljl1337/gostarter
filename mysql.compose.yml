services:
  mysql:
    image: mysql
    hostname: gostarter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: gostarter_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u admin -padmin"]
      interval: 1s
      timeout: 5s
      retries: 5