services:
  pg:
    image: postgres:alpine
    hostname: gostarter-pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gostarter_db
    ports:
      - "5432:5432"
    volumes:
      - ../data/test/pg/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gostarter_db"]
      interval: 1s
      timeout: 5s
      retries: 5